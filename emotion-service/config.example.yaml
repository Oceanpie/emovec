server:
  addr: ":8080"
  read_timeout: 15s
  write_timeout: 30s

embedding:
  providers:
    # Primary: self-hosted embedding endpoint
    - name: selfhost
      base_url: "${EMBEDDING_SELFHOST_URL}"
      api_key: "${EMBEDDING_SELFHOST_KEY}"
      model: "Qwen/Qwen3-Embedding-0.6B"
      batch_size: 64
      timeout: 30s

    # Fallback: local OpenAI-compatible API (Ollama, vLLM, LocalAI...)
    - name: local
      base_url: "${EMBEDDING_LOCAL_URL}"
      api_key: "${EMBEDDING_LOCAL_KEY}"
      model: "Qwen/Qwen3-Embedding-0.6B"
      batch_size: 64
      timeout: 30s

  instruction: "Given a Chinese emotional utterance, retrieve the most relevant emotion description that matches the emotional state expressed"

matching:
  top_k: 7
  tau: 0.5
  scheme: "plutchik"

data:
  model_path: "data/model.safetensors"
